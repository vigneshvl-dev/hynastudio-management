<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2560" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a161b" />
      <stop offset="35%" stop-color="#180b0e" />
      <stop offset="70%" stop-color="#120507" />
      <stop offset="100%" stop-color="#0a0203" />
    </linearGradient>

    <!-- Crimson Flame Gradient 1 -->
    <linearGradient id="flame-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#881337" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Crimson Flame Gradient 2 (Highlights) -->
    <linearGradient id="flame-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#9f1239" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2c0608" stop-opacity="0.95" />
    </linearGradient>

    <!-- Deep Shadow Gradient -->
    <radialGradient id="center-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9f1239" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#180b0e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#070102" stop-opacity="0.95" />
    </radialGradient>

    <!-- Blur Filters -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    
    <filter id="flame-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
  </defs>

  <!-- Base Solid Background -->
  <rect width="1440" height="2560" fill="url(#bg-grad)" />

  <!-- Center Ambient Radial Glow -->
  <rect width="1440" height="2560" fill="url(#center-glow)" />

  <!-- Right Flame Tendrils -->
  <g filter="url(#flame-blur)">
    <!-- Main Right High Flame -->
    <path d="M 1440 100 C 1200 300, 1100 600, 1250 900 C 1380 1150, 1050 1450, 1200 1800 C 1320 2100, 1100 2400, 1440 2560 Z" 
          fill="url(#flame-grad-1)" />

    <!-- Inner Right Flame Accent -->
    <path d="M 1440 300 C 1300 500, 1180 800, 1320 1100 C 1450 1350, 1150 1700, 1350 2100 C 1420 2300, 1380 2500, 1440 2560 Z" 
          fill="url(#flame-grad-2)" />

    <!-- Top Right Curved Tongue -->
    <path d="M 1440 0 C 1350 150, 1250 250, 1380 450 C 1440 550, 1400 700, 1440 800 Z" 
          fill="#ef4444" opacity="0.45" />
  </g>

  <!-- Left Bottom Flame Waves -->
  <g filter="url(#soft-blur)">
    <path d="M 0 1200 C 250 1350, 350 1600, 180 1850 C 50 2100, 300 2350, 0 2560 Z" 
          fill="url(#flame-grad-1)" />
          
    <path d="M 0 1500 C 180 1650, 250 1900, 100 2200 C 200 2380, 120 2500, 0 2560 Z" 
          fill="url(#flame-grad-2)" />
  </g>

  <!-- Bottom Deep Crimson Melt -->
  <path d="M 0 2000 C 400 1850, 900 2200, 1440 1950 L 1440 2560 L 0 2560 Z" 
        fill="#450a0a" opacity="0.75" />
  
  <path d="M 0 2200 C 500 2100, 1000 2300, 1440 2150 L 1440 2560 L 0 2560 Z" 
        fill="#881337" opacity="0.6" />

  <!-- Vignette Frame Overlay -->
  <rect width="1440" height="2560" fill="none" stroke="#000000" stroke-width="40" opacity="0.4" />
</svg>
